name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name CH552G-CDC-Controller main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CH552G-CDC-Controller-Windows
          path: dist/CH552G-CDC-Controller.exe
